# Single serverless Lakeflow Declarative Pipeline covering all three medallion layers.
# The bundle's schema resources are the single source of truth for the layer names: they feed the
# configuration keys below, which the SQL reads via ${medallion_catalog}/${bronze_schema}/etc.
resources:
  pipelines:
    bakehouse_medallion:
      name: bakehouse_medallion
      serverless: true

      # Default catalog/schema for the pipeline. Every dataset is written with a fully-qualified
      # name, so these defaults are not relied upon for writes, but a UC pipeline requires them.
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}

      root_path: ../src/pipelines/bakehouse

      libraries:
        - glob:
            include: ../src/pipelines/bakehouse/transformations/**

      configuration:
        medallion_catalog: ${var.catalog}
        bronze_schema: ${resources.schemas.bronze.name}
        silver_schema: ${resources.schemas.silver.name}
        gold_schema: ${resources.schemas.gold.name}
