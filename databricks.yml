# Declarative Automation Bundle for the Bakehouse medallion project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse
  uuid: 428771a7-7200-451b-8fa7-1eeb5d1c5cb8
  # The direct deployment engine is required to manage Unity Catalog catalogs as bundle resources.
  engine: direct

experimental:
  # Keep the UC schema names literal (bronze/silver/gold). Without this, `mode: development`
  # prefixes schema names with `dev_<user>_`. Catalog names are never prefixed.
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

# Variable declarations. Values are assigned per target below.
# The catalog name is NEVER hardcoded in any YAML or SQL file: YAMLs read ${var.catalog}
# and SQL reads the ${medallion_catalog} pipeline configuration key (fed by ${var.catalog}).
variables:
  catalog:
    description: The medallion catalog (bronze/silver/gold schemas live here). Value differs per target.
  warehouse_id:
    description: The SQL warehouse used to run and refresh the AI/BI dashboard.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # 'mode: development' creates an isolated development copy of the resources.
    # See https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-47e2ac5e-1601.cloud.databricks.com
    variables:
      catalog: bakehouse_dev
  prod:
    mode: production
    workspace:
      host: https://dbc-47e2ac5e-1601.cloud.databricks.com
      # Deploy to a single, well-known location in production.
      root_path: /Workspace/Users/jeffersonjuniormoraes@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_prd
    permissions:
      - user_name: jeffersonjuniormoraes@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 8a3cc4d8-b5cd-4712-9cff-c73044cacde7
        level: CAN_MANAGE
